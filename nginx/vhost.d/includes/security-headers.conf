# Common security headers for OpenMicJoy domains

set $csp "default-src 'self'; ";
set $csp "${csp}script-src 'self' 'unsafe-inline' 'unsafe-eval'; ";
set $csp "${csp}style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; ";
set $csp "${csp}font-src 'self' https://fonts.gstatic.com data:; ";
set $csp "${csp}img-src 'self' data: https:; ";
set $csp "${csp}connect-src 'self'; ";
set $csp "${csp}worker-src 'self' blob:; ";
set $csp "${csp}manifest-src 'self'; ";
set $csp "${csp}frame-ancestors 'self'; ";
set $csp "${csp}form-action 'self'; ";
set $csp "${csp}base-uri 'self'; ";
set $csp "${csp}object-src 'none'; ";

add_header Content-Security-Policy-Report-Only "$csp" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

version: "3.8"
networks:
  proxy:
    external: true
    name: proxy

services:
  omjapp:
    build:
      context: .
      dockerfile: Dockerfile
    image: omjapp:2025-11-07
    container_name: omjapp
    restart: unless-stopped
    networks: [proxy]
    env_file:
      - .env.omjapp
    secrets:
      - omj_sendgrid_api_key
    environment:
      - NODE_ENV=production
      - VIRTUAL_HOST=openmicjoy.me,openmicjoy.com,www.openmicjoy.me,www.openmicjoy.com
      - LETSENCRYPT_HOST=openmicjoy.me,openmicjoy.com,www.openmicjoy.me,www.openmicjoy.com
      - VIRTUAL_PORT=4000
      - SMTP_PASS_FILE=/run/secrets/omj_sendgrid_api_key
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 20s

secrets:
  omj_sendgrid_api_key:
    file: /srv/secrets/omj_sendgrid_api_key

version: "3.8"
networks:
  proxy:
    external: true
    name: proxy

services:
  openmicjoy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openmicjoy
    restart: unless-stopped
    networks: [proxy]
    environment:
      - NODE_ENV=production
      - VIRTUAL_HOST=openmicjoy.me,openmicjoy.com,www.openmicjoy.me,www.openmicjoy.com
      - LETSENCRYPT_HOST=openmicjoy.me,openmicjoy.com,www.openmicjoy.me,www.openmicjoy.com
      - VIRTUAL_PORT=4000
    expose:
      - "4000"
    # (optional but recommended)
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 3s
      retries: 5
      start_period: 20s

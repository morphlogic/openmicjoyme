<mat-toolbar color="primary" class="app-toolbar">
  <a class="brand" routerLink="/" aria-label="OMJ home">
    <span class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 64 64" role="presentation" focusable="false">
        <circle class="brand-person" cx="23" cy="26" r="12" />
        <path class="brand-mic" d="M36 32 52 16" />
        <path class="brand-mic" d="M50 14 60 24 44 40" />
        <path class="brand-person" d="M24 40 18 56" />
        <path class="brand-stand" d="M40 34v18" />
        <path class="brand-stand" d="M34 56h12" />
        <path class="brand-mic" d="M36 31 40 34" />
      </svg>
    </span>
    <span class="brand-text">OMJ</span>
  </a>

  <span class="spacer"></span>

  <nav class="nav-icon-list" aria-label="Primary">
    <a
      mat-icon-button
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      aria-label="View this week's schedule"
    >
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" role="presentation" focusable="false">
          <rect x="4" y="6" width="24" height="22" rx="4" />
          <path d="M10 4v6M22 4v6" />
          <path d="M4 14h24" />
          <rect x="9" y="18" width="6" height="5" rx="1.5" />
        </svg>
      </span>
      <span class="sr-only">This Week</span>
    </a>

    <a
      mat-icon-button
      routerLink="/contact"
      routerLinkActive="active"
      aria-label="Contact"
    >
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" role="presentation" focusable="false">
          <path d="M6 8h20a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" />
          <path d="m6 11 10 7 10-7" />
        </svg>
      </span>
      <span class="sr-only">Contact</span>
    </a>

    <a
      mat-icon-button
      routerLink="/about"
      routerLinkActive="active"
      aria-label="About OpenMicJoy"
    >
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 32 32" role="presentation" focusable="false">
          <path d="M16 4a12 12 0 1 1 0 24 12 12 0 0 1 0-24z" />
          <path d="M16 23v-7.5a3.5 3.5 0 1 0-3.5-3.5" />
          <circle cx="16" cy="25" r="1" />
        </svg>
      </span>
      <span class="sr-only">About</span>
    </a>
  </nav>
</mat-toolbar>

<main class="container">
  <h1 class="sr-only">OpenMicJoy — DFW Comedy Schedule</h1>
  <div class="content-shell">
    <router-outlet></router-outlet>
  </div>
</main>

<footer class="footer">
  <div>© {{ currentYear }} OpenMicJoy — DFW Comedy</div>
  <a routerLink="/contact">Contact</a>
</footer>

<omj-toast-container></omj-toast-container>

name: CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

env:
  BUILD_DOCKER_IMAGE: ${{ vars.BUILD_DOCKER_IMAGE || 'false' }}

jobs:
  lint_and_typecheck:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Type check
        run: npm run type-check

  build:
    runs-on: ubuntu-latest
    needs: lint_and_typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build

      - name: Upload dist artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/openmicjoy

      - name: Build Docker image (optional)
        if: env.BUILD_DOCKER_IMAGE == 'true'
        run: docker build -t openmicjoy:ci .
